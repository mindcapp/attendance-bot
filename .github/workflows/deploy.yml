name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_DIR: attendance-bot
  REMOTE_DIR: /opt/attendance-bot

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t attendance-bot:test ./${{ env.APP_DIR }}

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'SSHEOF'
          mkdir -p ${{ env.REMOTE_DIR }}
          cd ${{ env.REMOTE_DIR }}
          tar -xzf - --exclude=.env --exclude=attendance.csv --exclude=logs --exclude=bin
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
          docker compose down
          docker compose up -d
          SSHEOF
        env:
          DEPLOY_FILES: |
            tar -C ${{ env.APP_DIR }} -czf - --exclude=.env --exclude=attendance.csv --exclude=logs --exclude=bin .
