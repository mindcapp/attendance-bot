name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_DIR: attendance-bot
  REMOTE_DIR: /opt/attendance-bot

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t attendance-bot:test ./${{ env.APP_DIR }}

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy files to VPS
        run: |
          SSH="ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          $SSH "mkdir -p ${{ env.REMOTE_DIR }}"
          tar -C ${{ env.APP_DIR }} --exclude=.env --exclude=attendance.csv --exclude=logs --exclude=bin -czf - . | $SSH "tar -C ${{ env.REMOTE_DIR }} -xzf -"

      - name: Create .env on VPS
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cat > ${{ env.REMOTE_DIR }}/.env << 'EOFENV'
TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
EOFENV"

      - name: Build and restart
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd ${{ env.REMOTE_DIR }} && docker compose down && docker compose up -d"

      - name: Health check
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'for i in $(seq 1 15); do if curl -fsS http://localhost:9090/metrics > /dev/null 2>&1; then echo "Bot is up"; exit 0; fi; sleep 2; done; echo "Bot failed"; exit 1'
