name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t attendance-bot:test ./attendance-bot

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOY'
          cd /opt/attendance-bot
          mkdir -p /opt/attendance-bot
          cat > .env << 'ENV'
TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
ENV
          docker compose down
          docker compose up -d
          DEPLOY
          
      - name: Copy code
        run: rsync -avz --delete -e "ssh -i ~/.ssh/id_deploy" attendance-bot/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/attendance-bot/ --exclude=.env --exclude=attendance.csv --exclude=logs --exclude=bin
